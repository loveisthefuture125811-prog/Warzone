<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warzone Armory</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
body { font-family: 'VT323', monospace; }
.neon-green { color: #00ff9d; text-shadow: 0 0 10px #00ff9d; }
.slot-update { animation: flash 0.3s; }
@keyframes flash { 0% { background: #00ff9d20; } 100% { background: transparent; } }
</style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
<div class="max-w-7xl mx-auto p-4">

  <!-- HEADER -->
  <div class="flex justify-between items-center border-b border-[#00ff9d]/30 pb-4 mb-6">
    <div>
      <h1 class="text-4xl neon-green">WARZONE ARMORY</h1>
      <p id="headerCount" class="text-[#00ff9d] text-xl">000 WEAPONS &bull; CHRONOLOGICAL</p>
    </div>
    <div class="text-right">
      <div id="totalCount" class="text-3xl neon-green font-bold">000</div>
      <p class="text-xs text-gray-400">AUDITED WEAPONS</p>
    </div>
  </div>

  <!-- RANDOMIZER SECTION -->
  <div class="mb-12">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-3xl neon-green">RANDOMIZER</h2>
      <div class="flex gap-3">
        <button onclick="generateNewLoadout()"
          class="px-6 py-3 bg-black border border-[#00ff9d] hover:bg-[#00ff9d] hover:text-black transition text-lg">PURE RANDOM</button>
        <button onclick="generateLoadout('standard')"
          class="px-6 py-3 bg-black border border-[#00ff9d] hover:bg-[#00ff9d] hover:text-black transition text-lg">WIELDY + SPECIAL</button>
        <button onclick="clearRandomizerFilters()"
          class="px-6 py-3 bg-zinc-900 hover:bg-red-900/30 text-red-400 border border-red-400/50 transition">CLEAR FILTERS</button>
      </div>
    </div>

    <!-- Filters -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div>
        <label class="block text-xs text-gray-400 mb-1">ORIGIN GAME</label>
        <select id="originFilter" multiple class="w-full bg-black border border-[#00ff9d]/50 text-[#00ff9d] p-3 rounded-xl h-32"></select>
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">CLASS</label>
        <select id="variantFilter" multiple class="w-full bg-black border border-[#00ff9d]/50 text-[#00ff9d] p-3 rounded-xl h-32"></select>
      </div>
    </div>

    <!-- Loadout Slots -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="border border-[#00ff9d]/30 rounded-3xl p-6 bg-black/50">
        <div class="flex justify-between items-center mb-4">
          <div class="text-[#00ff9d] text-xl">PRIMARY</div>
          <button onclick="rerollSlot('primary')" class="text-xs px-4 py-1 border border-[#00ff9d]/50 hover:border-[#00ff9d] rounded-2xl">REROLL &#x1F504;</button>
        </div>
        <div id="primarySlot" class="min-h-[140px] flex items-center justify-center text-center"></div>
      </div>
      <div class="border border-[#00ff9d]/30 rounded-3xl p-6 bg-black/50">
        <div class="flex justify-between items-center mb-4">
          <div class="text-[#00ff9d] text-xl">SECONDARY</div>
          <button onclick="rerollSlot('secondary')" class="text-xs px-4 py-1 border border-[#00ff9d]/50 hover:border-[#00ff9d] rounded-2xl">REROLL &#x1F504;</button>
        </div>
        <div id="secondarySlot" class="min-h-[140px] flex items-center justify-center text-center"></div>
      </div>
      <div class="border border-[#00ff9d]/30 rounded-3xl p-6 bg-black/50">
        <div class="flex justify-between items-center mb-4">
          <div class="text-[#00ff9d] text-xl">MELEE</div>
          <button onclick="rerollSlot('melee')" class="text-xs px-4 py-1 border border-[#00ff9d]/50 hover:border-[#00ff9d] rounded-2xl">REROLL &#x1F504;</button>
        </div>
        <div id="meleeSlot" class="min-h-[140px] flex items-center justify-center text-center"></div>
      </div>
    </div>

    <!-- Copy button -->
    <div class="mt-6 text-center">
      <button onclick="copyCurrentLoadout(this)"
        class="px-8 py-4 bg-[#00ff9d] text-black font-bold text-xl rounded-3xl hover:scale-105 transition flex items-center gap-3 mx-auto">
        &#x1F4CB; COPY LOADOUT TO CLIPBOARD
      </button>
    </div>
  </div>

  <!-- FULL ARMORY TABLE -->
  <div>
    <h2 class="text-3xl neon-green mb-4">FULL ARMORY</h2>
    <div class="flex flex-col md:flex-row gap-4 mb-6">
      <input id="searchInput" type="text" placeholder="Search weapons, class, or game..."
        class="flex-1 bg-black border border-[#00ff9d]/50 text-white placeholder:text-gray-500 p-4 rounded-3xl focus:outline-none">
      <select id="gameFilter" class="bg-black border border-[#00ff9d]/50 text-[#00ff9d] p-4 rounded-3xl"></select>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full border-collapse">
        <thead>
          <tr class="border-b border-[#00ff9d]/30">
            <th class="text-left px-6 py-4 text-[#00ff9d]">ID</th>
            <th class="text-left px-6 py-4 text-[#00ff9d]">WEAPON</th>
            <th class="text-left px-6 py-4 text-[#00ff9d]">CLASS</th>
            <th class="text-left px-6 py-4 text-[#00ff9d]">GAME</th>
          </tr>
        </thead>
        <tbody id="weaponTable" class="text-sm"></tbody>
      </table>
    </div>

    <div id="noResults" class="hidden text-center py-12 text-red-400">
      No weapons match your search.
    </div>
    <div id="filteredCount" class="text-center text-xs text-gray-400 mt-4"></div>
  </div>

  <!-- FOOTER -->
  <div id="footer" class="text-center text-xs text-gray-500 mt-16 border-t border-[#00ff9d]/20 pt-6">
    THE CHRONOLOGICALLY AUDITED WARZONE ARMORY
  </div>
</div>

<!-- TOAST -->
<div id="armory-toast" class="hidden"></div>

<script src="weapons.js"></script>
<script src="app.js"></script>

</body>
</html>
